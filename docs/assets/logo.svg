<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="EXTRA">
  <title>EXTRA</title>
  <rect x="0" y="0" width="640" height="200" rx="16" fill="#ffffff"/>
  <!-- pitch, drawn vertically split into phase bands -->
  <g transform="translate(24,28)">
    <rect x="0" y="0" width="216" height="144" rx="10" fill="#f3f7f2" stroke="#8fa38f" stroke-width="2"/>
    <rect x="0"   y="0" width="36" height="144" fill="#1f6fb2" opacity="0.16"/>
    <rect x="36"  y="0" width="36" height="144" fill="#1f6fb2" opacity="0.28"/>
    <rect x="72"  y="0" width="36" height="144" fill="#1f6fb2" opacity="0.40"/>
    <rect x="108" y="0" width="36" height="144" fill="#c2453c" opacity="0.40"/>
    <rect x="144" y="0" width="36" height="144" fill="#c2453c" opacity="0.28"/>
    <rect x="180" y="0" width="36" height="144" fill="#c2453c" opacity="0.16"/>
    <line x1="108" y1="0" x2="108" y2="144" stroke="#8fa38f" stroke-width="2"/>
    <circle cx="108" cy="72" r="22" fill="none" stroke="#8fa38f" stroke-width="2"/>
    <rect x="0" y="40" width="26" height="64" fill="none" stroke="#8fa38f" stroke-width="2"/>
    <rect x="190" y="40" width="26" height="64" fill="none" stroke="#8fa38f" stroke-width="2"/>
    <!-- eleven -->
    <g fill="#ffffff" stroke="#1d2b28" stroke-width="2">
      <circle cx="14" cy="72" r="6"/>
      <circle cx="46" cy="26" r="6"/><circle cx="46" cy="58" r="6"/><circle cx="46" cy="86" r="6"/><circle cx="46" cy="118" r="6"/>
      <circle cx="90" cy="48" r="6"/><circle cx="90" cy="96" r="6"/>
      <circle cx="132" cy="24" r="6"/><circle cx="132" cy="72" r="6"/><circle cx="132" cy="120" r="6"/>
      <circle cx="176" cy="72" r="6"/>
    </g>
    <!-- a run trace -->
    <path d="M132 120 C150 110, 160 96, 176 84" fill="none" stroke="#1d2b28" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <text x="272" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="800" fill="#1d2b28" letter-spacing="2">EXTRA</text>
  <text x="275" y="148" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#4a5a56">EventXI with TRAcking</text>
